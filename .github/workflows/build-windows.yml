name: Build Windows EXE

on:
  push:
    tags: ["v*"]          # 推送 v* 标签时打包发布
  workflow_dispatch: {}   # 也允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install PySide6 pyinstaller

      - name: Download ffmpeg ( essentials build )
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp
          $dir = Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1
          Copy-Item "$($dir.FullName)/bin/ffmpeg.exe" -Destination .
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name audiocutter audio_cutter.py
          Copy-Item ffmpeg.exe -Destination dist/

      - name: Upload artifact (每次构建都可在 Artifacts 下载)
        uses: actions/upload-artifact@v4
        with:
          name: audiocutter-windows
          path: dist/

      - name: Release (仅 tag 触发时发布到 Releases)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/audiocutter.exe
            dist/ffmpeg.exe
